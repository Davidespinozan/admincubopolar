name: E2E Smoke Tests

# Tanda 13 (histórico): cron diario + post-deploy contra producción.
# Desde GL-1 (2026-10-06) solo manual y nunca contra producción.
#
# Cron: 0 9 * * * UTC
#   = 3:00 AM Durango (UTC-6, sin DST)
#   = 11:00 AM Valencia en verano CEST (UTC+2)
#   = 10:00 AM Valencia en invierno CET  (UTC+1)
# Si el horario te incomoda, ajustar aquí (formato: minuto hora * * *).
#
# Notificación de fallo: GitHub envía email automático al owner del
# repo. Plus, Playwright HTML report queda como artifact (7 días).

# GO-LIVE GL-1 (2026-10-06): E2E SMOKES MUST NOT RUN AGAINST PRODUCTION.
# Sin cron ni push: solo ejecución manual, y el job se niega a correr si
# E2E_BASE_URL apunta a producción. Reactivar la automatización solo cuando
# exista un entorno de STAGING con cuentas propias (credenciales solo en
# GitHub Secrets / gestor de secretos, nunca en el repositorio).
on:
  workflow_dispatch:

jobs:
  smokes:
    name: Smokes contra STAGING (nunca producción)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Negarse a correr contra producción (GL-1)
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
        run: |
          case "${E2E_BASE_URL}" in
            ""|*sistema.cubopolar.com*) echo "E2E_BASE_URL vacía o de PRODUCCIÓN: E2E SMOKES MUST NOT RUN AGAINST PRODUCTION." ; exit 1 ;;
          esac

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        # --with-deps trae las libs de sistema que chromium necesita en
        # ubuntu-latest (libnss, libatk, fontconfig, etc.). Sin esto el
        # browser no levanta.
        run: npx playwright install --with-deps chromium

      - name: Run E2E smokes
        run: npm run test:e2e
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_VENTAS_EMAIL: ${{ secrets.E2E_VENTAS_EMAIL }}
          E2E_VENTAS_PASSWORD: ${{ secrets.E2E_VENTAS_PASSWORD }}
          E2E_CHOFER_EMAIL: ${{ secrets.E2E_CHOFER_EMAIL }}
          E2E_CHOFER_PASSWORD: ${{ secrets.E2E_CHOFER_PASSWORD }}

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 7

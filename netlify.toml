[[redirects]]
  from = "/pagar/:id"
  to = "/.netlify/functions/billing-pay?o=:id"
  status = 200
  force = true

# Nota de venta pública con token firmado (Tanda 28). El query ?t=...
# pasa íntegro a la function.
[[redirects]]
  from = "/nota/:id"
  to = "/.netlify/functions/recibo?o=:id"
  status = 200
  force = true

[[redirects]]
  from = "/pago-resultado"
  to = "/.netlify/functions/billing-result"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Crons (Tanda 21). Netlify agenda en UTC: 13:00 UTC = 7:00 CDMX.
# El schedule DEBE declararse aquí; sin este bloque la función existe
# pero nunca corre sola.
[functions."cron-cxc-vencidas"]
  schedule = "0 13 * * *"

[functions."cron-rutas-atoradas"]
  schedule = "30 13 * * *"

# Tanda 30: reparte Web Push de notificaciones nuevas cada 5 min.
[functions."cron-push"]
  schedule = "*/5 * * * *"

# Assets con hash en nombre → cache inmutable (1 año)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML y SW → siempre revalidar
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(self), microphone=()"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
